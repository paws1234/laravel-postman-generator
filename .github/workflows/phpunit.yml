name: PHPUnit Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - php-version: '8.1'
            laravel: '9'
          - php-version: '8.2'
            laravel: '9'
          - php-version: '8.2'
            laravel: '10'
          - php-version: '8.2'
            laravel: '11'
          - php-version: '8.2'
            laravel: '12'
          - php-version: '8.3'
            laravel: '9'
          - php-version: '8.3'
            laravel: '10'
          - php-version: '8.3'
            laravel: '11'
          - php-version: '8.3'
            laravel: '12'

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, dom
          coverage: none


      - name: Require correct orchestra/testbench for Laravel version
        run: |
          if [ "${{ matrix.laravel }}" = "9" ]; then
            composer require --dev orchestra/testbench:^8.0 --no-interaction --no-update
          elif [ "${{ matrix.laravel }}" = "10" ]; then
            composer require --dev orchestra/testbench:^9.0 --no-interaction --no-update
          elif [ "${{ matrix.laravel }}" = "11" ]; then
            composer require --dev orchestra/testbench:^10.0 --no-interaction --no-update
          fi
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Laravel Pint (lint)
        run: vendor/bin/pint --test

      - name: Run PHPUnit
        run: vendor/bin/phpunit -c phpunit.xml --testdox
